services:
  minio:
    image: quay.io/minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: fadwa123@#
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
