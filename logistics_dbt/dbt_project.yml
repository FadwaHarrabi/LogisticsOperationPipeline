name: logistics_dbt

profile: logistics_dbt

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["test"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  logistics_dbt:
    +schema: raw

snapshots:
  # Builds snapshots into '<your_schema_name>_snapshots'
  logistics_dbt:
    +schema: snapshots

models:
  logistics_dbt:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: table
      +schema: analytics
    marts:
      +materialized: table
      +schema: analytics
