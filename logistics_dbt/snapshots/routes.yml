snapshots:
   - name: routes
     relation: source('logistics', 'routes')
     config:
       schema: snapshots
       strategy: check
       unique_key: route_id
       check_cols:
         -origin_city
         -origin_state
         -destination_city
         -destination_state
         -distance_miles
         -typical_transit_days
         -base_rate_per_mile
         -fuel_surcharge_rate
       dbt_valid_to_current: "to_date('9999-12-31')"
       hard_deletes: invalidate
       snapshot_meta_column_names:
         dbt_valid_from: start_date
         dbt_valid_to: end_date