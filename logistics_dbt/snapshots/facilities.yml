snapshots:
  - name: facilities
    relation: source('logistics', 'facilities')
    config:
      schema: snapshots
      strategy: check
      unique_key: facility_id
      check_cols:
        -facility_name
        -facility_type
        -city
        -state
        -latitude
        -longitude
        -docks_doors
        -capacity 
          
      dbt_valid_to_current: "to_date('9999-12-31')"
      hard_deletes: invalidate
      snapshot_meta_column_names:
        dbt_valid_from: start_date
        dbt_valid_to: end_date