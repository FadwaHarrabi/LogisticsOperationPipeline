snapshots:
    - name: trucks
      relation: source('logistics', 'trucks')
      config:
        schema: snapshots
        strategy: check
        unique_key: truck_id
        check_cols:
          -acquisition_cost
          -fuel_type
          -tank_capacity_gallons
          -status 
          
        dbt_valid_to_current: "to_date('9999-12-31')"
        hard_deletes: invalidate
        snapshot_meta_column_names:
          dbt_valid_from: start_date
          dbt_valid_to: end_date