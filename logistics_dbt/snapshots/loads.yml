snapshots:
  - name: loads
    relation: source('logistics', 'loads')
    config:
      schema: snapshots
      strategy: check
      unique_key: load_id
      check_cols:
        -customer_id
        -route_id
        -load_date
        -load_type
        -weight_lbs
        -pieces
        -revenue
        -fuel_surcharge
        -accessorial_charges
        -load_status
        -booking_type

      dbt_valid_to_current: "to_date('9999-12-31')"
      hard_deletes: invalidate
      snapshot_meta_column_names:
        dbt_valid_from: start_date
        dbt_valid_to: end_date